<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meus links</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233347FF'/%3E%3Cpath d='M11 21l10-10M14 11h7v7' stroke='%23fff' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<script>try{document.documentElement.dataset.theme=localStorage.getItem('ml:theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}</script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="shell">
  <header class="top">
    <div><h1>Meus links</h1><p id="stats" class="stats"></p></div>
    <div class="top-actions">
      <button id="b-export" class="ghost" type="button">Exportar</button>
      <button id="b-import" class="ghost" type="button">Importar</button>
      <button id="b-theme" class="icon-btn" type="button" aria-label="Alternar tema" data-icon="moon"></button>
      <input id="f-import" type="file" accept="application/json" hidden>
    </div>
  </header>

  <form id="adder" class="adder" autocomplete="off">
    <span class="adder-ico" data-icon="link"></span>
    <input id="add-in" inputmode="url" placeholder="Cole um link e aperte Enter" aria-label="Link do site">
    <button class="primary" type="submit">Adicionar</button>
  </form>

  <div class="toolbar">
    <div id="chips" class="chips" role="group" aria-label="Filtros"></div>
    <label class="search"><span data-icon="search"></span><input id="q" type="search" placeholder="Buscar" aria-label="Buscar"></label>
  </div>

  <main id="grid" class="grid"></main>
  <div id="empty" class="empty" hidden></div>
  <p class="foot">Seus links ficam salvos só neste navegador. Use Exportar para fazer backup.</p>
</div>

<dialog id="ed">
  <form id="ed-form" novalidate>
    <h2>Editar card</h2>
    <div id="ed-cover" class="cover ed-cover"></div>
    <div class="row">
      <button id="ed-up" class="ghost" type="button">Enviar imagem</button>
      <button id="ed-auto" class="ghost" type="button">Imagem automática</button>
      <input id="ed-file" type="file" accept="image/*" hidden>
    </div>
    <label>Nome<input id="ed-title" maxlength="80"></label>
    <label>Descrição<textarea id="ed-desc" rows="3" maxlength="400"></textarea></label>
    <label>Link do site<input id="ed-url"></label>
    <label>Link da imagem (opcional)<input id="ed-img" placeholder="https://..."></label>
    <label>Categoria<input id="ed-tag" list="tags" maxlength="24" placeholder="Ex.: Trabalho"></label>
    <datalist id="tags"></datalist>
    <p id="ed-err" class="error" role="alert" hidden></p>
    <div class="row end">
      <button id="ed-cancel" class="ghost" type="button">Cancelar</button>
      <button class="primary" type="submit">Salvar</button>
    </div>
  </form>
</dialog>
<div id="toasts" class="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
